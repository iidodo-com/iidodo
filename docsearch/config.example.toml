# docsearch 設定ファイルの例。
# 「config.toml」という名前でコピーして、ダミーパスを実際のパスに書き換えてください。
# config.toml は .gitignore に入れてあり、リポジトリには含めません。
#
# 書式: TOML（UTF-8 で保存）
# Windows のパスは「/」で書くか、シングルクォートで囲んでください。
#   正: "//サーバ名/共有名/資料"   '\\サーバ名\共有名\資料'   "D:/資料"
#   誤: "D:\資料"（ \ が特殊文字として扱われ、エラーになります）
# 相対パスは、この設定ファイルのあるフォルダが基準になります。

# 検索対象のフォルダ（複数可）。ダミーパスです。
roots = ["D:/ダミー資料", "//ダミーサーバ/共有/ダミー資料"]

# インデックス（index.db）の場所。文書の本文を含みます。共有フォルダ上には置かないでください。
db_path = "index.db"

# CSV・インデックス作成レポートの出力先
output_dir = "output"

# 取り込む拡張子
extensions = ["docx", "xlsx", "pptx", "pdf"]

# 読めない旧形式（対象外として件数と一覧を出力します）
legacy_extensions = ["doc", "xls", "ppt"]

# 除外するファイル名・フォルダ名のパターン（大文字小文字は区別しません。* ? [] が使えます）
exclude_patterns = ["~$*", "*.tmp", "Thumbs.db"]

# 1ファイルあたりのサイズ上限（MB）。超えたものは「対象外(サイズ)」として記録します。
max_file_size_mb = 100

# 1つのExcelファイルから取り込む文字列セルの上限
max_cells_per_xlsx = 50000

# true にすると Excel の数値セルも取り込みます（既定は文字列セルのみ）
include_numbers_in_xlsx = false

# スニペットで検索語の前後に表示する文字数
snippet_chars = 60

# ダブルクリックで開く方法
#   "copy"     : 一時フォルダに読み取り専用のコピーを作って開く（既定。対象フォルダにロックファイル等ができない）
#   "original" : 元ファイルを直接開く（Word・Excel が同じフォルダに ~$ のロックファイルを作ることがある）
open_mode = "copy"

# 共有フォルダに繋がらない等で、大量のファイルが「削除された」ように見える場合に削除を止める
mass_delete_guard = true
