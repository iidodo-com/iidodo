# ==============================================================
# OCRツール設定ファイル
# コマンドライン引数（--input / --output / --lang など）は、
# ここの値より優先されます。
# ==============================================================

# --- 入出力 ---
input_dir: ./in          # 読み取る画像・PDFを置くフォルダ
output_dir: ./out        # 結果の出力先フォルダ
recursive: false         # true にするとサブフォルダも対象にする

# --- OCRエンジン（Tesseract） ---
ocr:
  # 言語。横書き: jpn / 縦書き: jpn_vert / 英数字も混在: jpn+eng
  # ※ 横書きと縦書きが混在する文書は、言語を切り替えて2回実行してください
  language: jpn
  # ページ分割モード。auto なら横書き=3（自動）、縦書き=5（縦書き1ブロック）
  # 手動指定する場合は 0〜13 の数字（例: 6 = 単一の均一なブロック）
  psm: auto
  dpi: 300                # 画像にdpi情報がないときの想定解像度
  timeout_sec: 300        # 1ページあたりの制限時間（秒）
  # Tesseract本体のパス。PATHに通していない（管理者権限なしで入れた）場合に指定
  # 例: C:/Users/あなた/AppData/Local/Tesseract-OCR/tesseract.exe
  tesseract_cmd: null
  # 日本語データ(jpn.traineddata)を置いたフォルダ。通常は null のままでよい
  tessdata_dir: null
  # （帳票突合用・任意）2つ目の言語データのフォルダ。tessdata_best など別モデルを指定すると、
  # 両方で読んで結果を比べるため精度が安定します（処理時間は約2倍）。reconcile.py だけが使います。
  second_tessdata_dir: null
  # 読み取りエンジン。tesseract=印刷文字（既定）/ handwriting=手書き（manga-ocr。下の handwriting の準備が必要）
  #   google / azure = クラウドOCR（★書類の画像が外部に送信されます。下の cloud の準備が必要）
  # ※ コマンドの --engine handwriting などでも切り替えられます（run_handwriting.bat）
  engine: tesseract
  # 日本語OCRが文字間に入れがちな不要な空白を取り除く
  remove_cjk_spaces: true

# --- PDFの画像化 ---
pdf:
  render_dpi: 300         # PDFを画像にするときの解像度（大きいほど高精度・低速）

# --- 前処理 ---
preprocess:
  enabled: true           # false にすると以下の設定にかかわらず前処理をすべて省略
  grayscale: true         # グレースケール化
  deskew: true            # 傾き補正（±15度まで）
  denoise: nlmeans        # ノイズ除去: none / median（高速だが細い線を傷める）/ nlmeans（推奨・やや低速）
  flatten: true           # 照明ムラ・影の補正（スマホ撮影や、端が暗いスキャンに有効）
  remove_lines: true      # 表・枠の罫線を消す（罫線が「山」「|」などの文字に化けるのを防ぐ）
  binarize: none          # 二値化: none / otsu（Tesseract自身が内部で二値化するため、通常は none のほうが良好）

# --- 手書きモード（任意。setup_handwriting.bat で導入します） ---
handwriting:
  # true にすると、reconcile.py（帳票突合）の「手書き欄」を手書き用モデルで読みます（それ以外の項目は影響なし）
  enabled: false
  # 手書き用モデルを置いたフォルダ（例: ./models/manga-ocr-base）。null なら初回に自動ダウンロード（インターネット接続が必要）
  model_dir: null

# --- クラウドOCR（任意。Google Cloud Vision / Azure AI Vision。★画像が外部に送信されます） ---
cloud:
  # 送信の許可。false のままでは、クラウドは一切使われません（誤送信の防止）。
  # 個人情報（氏名・口座番号など）を含む書類を送ってよいか確認してから true にしてください。
  allow_upload: false
  # APIキーは、config.yaml に書かず、環境変数に設定するのがおすすめです（README「クラウドOCR」参照）
  #   Google: GOOGLE_VISION_API_KEY / Azure: AZURE_VISION_KEY と AZURE_VISION_ENDPOINT
  google:
    api_key: null
    url: https://vision.googleapis.com/v1/images:annotate
  azure:
    endpoint: null
    key: null
    api_version: "2024-02-01"
  # reconcile.py（帳票突合）で併用するクラウド。[google] [azure] [google, azure] のいずれか。使わないなら []
  # （--cloud google,azure でも指定できます。ページ全体を1回だけ送り、各項目に結果を割り当てます）
  reconcile_engines: []
  # true: クラウドの読み取りがあれば、それを優先して採用する（Tesseractの結果は照合・揺れの検出に使う）
  prefer_cloud: true
  # このツールでの月ごとの利用回数が無料枠に達したら、送信を止める（他の用途の利用分は数えられません）
  stop_at_free_limit: true
  free_limit: {google: 1000, azure: 5000}   # 無料枠は変更されることがあります。公式の最新情報で確認して書き換えてください
  timeout_sec: 60
  usage_file: ./cloud_usage.json

# --- レイアウト（表・枠のある書類の読み方） ---
layout:
  # auto  : 罫線で囲まれたマス目が min_cells 個以上あれば「セルモード」、なければ通常の文章として読む
  # cells : 常にマス目ごとに読む（帳票・表向け。隣のマスの文字が混ざらない）
  # text  : 常にページ全体を文章として読む（枠のない書類）
  mode: auto
  min_cells: 4

# --- 要確認箇所の一覧（review.csv） ---
review:
  threshold: 70           # この信頼度(0〜100)未満の行を「人が確認すべき箇所」として出力
                          # ※ 合成サンプルでは70だと誤り行を1行も拾えず、90で約4割でした。README「既知の限界」参照
  word_level: false       # true にすると単語単位の低信頼度も出力

# --- 出力 ---
output:
  page_txt: true          # ページごとのテキスト(.txt)
  searchable_pdf: true    # 検索可能PDFを作る
  page_header: true       # 結合テキストにページ区切りの見出しを入れる
