# 共有フォルダ棚卸しツール 設定ファイル（UTF-8）
# 正規表現は ' ' (シングルクォート) で囲むと、バックスラッシュをそのまま書けます。

# 基準日（YYYY-MM-DD）。空 "" にすると実行日を使います（再現性が必要なら日付を指定）
reference_date = ""
# 基準日からこの年数以上前に更新されたファイルを「長期未更新」とします
stale_years = 3
# 階層の深さ（対象フォルダ直下のフォルダ=1）がこの値を超えるフォルダを別途一覧にします
depth_threshold = 8

[scan]
# 除外するファイル名（大文字小文字を区別しない * ? のパターン）
exclude_names = ["~$*", "Thumbs.db", "desktop.ini", ".DS_Store"]
# 除外するフォルダ名（同上）。中は走査しません
exclude_dirs = []

[hash]
# 部分ハッシュで読む先頭・末尾それぞれのバイト数
partial_bytes = 65536
# 1ファイルあたりの全体読み込みの上限バイト数。超えたものは先頭・末尾のみで「全体は未確認」
max_read_bytes = 1073741824

[naming]
# ファイル名（拡張子を含む）に re.search で照合します。
# required_patterns: いずれかに合致しないファイルを逸脱とみなす。空 [] なら「規則未設定」
# forbidden_patterns: 合致したファイルを逸脱とみなす。
# 記入例（先頭が日付8桁＋アンダースコア / 全角スペース / 半角カナ / 禁止文字）:
#   required_patterns  = ['^\d{8}_']
#   forbidden_patterns = ['　', '[\uff61-\uff9f]', '[#%&]']
required_patterns = []
forbidden_patterns = []

[version]
# 版管理の崩れを示す語。拡張子を除いた名前（全角英数字は半角に正規化）に照合します。
patterns = ['最終', '最新', 'コピー', '(?i)_final', '(?i)_v\d+', ' \(\d+\)']
