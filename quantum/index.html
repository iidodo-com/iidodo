<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="description" content="さわって遊んで、量子コンピュータの仕組みがほんとうにわかるアプリ">
<title>量子のひみつ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- ホーム -->
  <section id="home" class="screen active">
    <div class="hero">
      <canvas id="hero-canvas" aria-hidden="true"></canvas>
      <div class="hero-text">
        <p class="eyebrow">さわって学ぶ</p>
        <h1>量子のひみつ</h1>
        <p class="lead">むずかしい式はゼロ。<br>さわって遊ぶうちに、量子コンピュータの<br>「ほんとうの仕組み」がわかります。</p>
      </div>
    </div>
    <div class="progress-row">
      <div class="progress-bar"><i id="progress-fill"></i></div>
      <span id="progress-text">0 / 9</span>
    </div>
    <ol id="chapter-list" class="chapter-list"></ol>
    <button id="install-btn" class="btn ghost install" hidden>📲 ホーム画面に追加する</button>
    <p class="foot">※ここで動いているのは、本物の量子計算と同じルールで動く小さなシミュレータです。</p>
  </section>

  <!-- 章 -->
  <section id="chapter" class="screen">
    <header class="ch-head">
      <button id="back-btn" class="icon-btn" aria-label="ホームへ戻る">←</button>
      <div class="ch-title" id="ch-title"></div>
      <div class="dots" id="dots"></div>
    </header>
    <div id="step" class="step"></div>
    <footer class="ch-foot">
      <button id="prev-btn" class="btn ghost">戻る</button>
      <button id="next-btn" class="btn primary">次へ</button>
    </footer>
  </section>
</div>
<canvas id="confetti" aria-hidden="true"></canvas>

<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>
