# android-transcriber の APK をビルドする（手動実行のみ）。
# sherpa-onnx の Kotlin API とネイティブライブラリは、ビルド時に公式リポジトリ/Releases から取得する（リポジトリには含めない）。
# 注意: このワークフローは作成環境（github.com への接続不可）では実行できておらず、未検証。
name: android-transcriber
on:
  workflow_dispatch:
    inputs:
      sherpa_version:
        description: "sherpa-onnx のバージョン（例: 1.13.8）。Kotlin API と .so を同じ版で取得する"
        required: true
        default: "1.13.8"
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-transcriber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Fetch sherpa-onnx Kotlin API and native libs
        run: |
          SHERPA_REF="v${{ inputs.sherpa_version }}" ./scripts/fetch_sherpa.sh
          ./scripts/fetch_sherpa_libs.sh "${{ inputs.sherpa_version }}"
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-transcriber/app/build/outputs/apk/debug/app-debug.apk
