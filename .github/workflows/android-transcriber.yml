# android-transcriber の APK をビルドして artifact に出力する。
# sherpa-onnx の Kotlin API とネイティブライブラリは、ビルド時に公式リポジトリ/Releases から取得する（リポジトリには含めない）。
name: android-transcriber
on:
  # デフォルトブランチに無い間は workflow_dispatch が使えないため、この開発ブランチへの push でも実行する
  push:
    branches: [ccr-8f9a4f1f-pafggk]
    paths: ["android-transcriber/**", ".github/workflows/android-transcriber.yml"]
  workflow_dispatch:
    inputs:
      sherpa_version:
        description: "sherpa-onnx のバージョン（例: 1.13.8）。Kotlin API と .so を同じ版で取得する"
        required: false
        default: "1.13.8"
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android-transcriber
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Ensure Android SDK packages
        working-directory: .
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch sherpa-onnx Kotlin API and native libs
        run: |
          SHERPA_REF="v${{ inputs.sherpa_version || '1.13.8' }}" ./scripts/fetch_sherpa.sh
          ./scripts/fetch_sherpa_libs.sh "${{ inputs.sherpa_version || '1.13.8' }}"
      - name: Fetch models (bundled into the APK)
        run: ./scripts/fetch_models.sh app/src/main/assets/models
      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest --console=plain
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: minutes-voice-debug-apk
          path: android-transcriber/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
