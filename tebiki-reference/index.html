<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>手引参照ツール</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>手引参照ツール</h1>
    <p class="subtitle">指摘事項と作業手引きの本文を紐づけて確認できます</p>
  </header>

  <section class="search-bar">
    <label class="field-label" for="tebiki-search-input">手引を全文検索</label>
    <div class="search-row">
      <input id="tebiki-search-input" type="text" placeholder="例：保護メガネ、点検、消火器 など" autocomplete="off">
      <button id="tebiki-search-clear" class="secondary-btn">クリア</button>
    </div>
    <div id="search-results" class="search-results hidden"></div>
  </section>

  <main class="main-grid">
    <section class="panel findings-panel">
      <div class="panel-header">
        <h2>指摘一覧</h2>
        <div class="panel-actions">
          <button id="add-rule-btn" class="secondary-btn">＋ 新規追加</button>
          <button id="export-rules-btn" class="secondary-btn">rules.json をエクスポート</button>
        </div>
      </div>

      <form id="rule-form" class="rule-form hidden">
        <input type="hidden" id="rule-form-id">
        <label class="field-label" for="rule-form-category">カテゴリ</label>
        <input id="rule-form-category" type="text" placeholder="例：安全">

        <label class="field-label" for="rule-form-title">指摘タイトル</label>
        <input id="rule-form-title" type="text" placeholder="例：保護メガネの未着用">

        <label class="field-label" for="rule-form-description">指摘内容</label>
        <textarea id="rule-form-description" rows="2" placeholder="指摘の詳細を入力"></textarea>

        <label class="field-label" for="rule-form-severity">重要度</label>
        <select id="rule-form-severity">
          <option value="high">高</option>
          <option value="medium" selected>中</option>
          <option value="low">低</option>
        </select>

        <div class="evidence-fields">
          <div>
            <label class="field-label" for="rule-form-page">根拠ページ</label>
            <input id="rule-form-page" type="number" min="1" placeholder="例：42">
          </div>
          <div>
            <label class="field-label" for="rule-form-chapter">章</label>
            <input id="rule-form-chapter" type="text" placeholder="例：第2章">
          </div>
          <div>
            <label class="field-label" for="rule-form-section">節</label>
            <input id="rule-form-section" type="text" placeholder="例：第3節">
          </div>
        </div>

        <p id="rule-form-error" class="error-text hidden"></p>

        <div class="btn-row">
          <button type="submit" id="rule-form-save" class="primary-btn">保存</button>
          <button type="button" id="rule-form-cancel" class="secondary-btn">キャンセル</button>
        </div>
      </form>

      <div id="rules-list" class="rules-list"></div>
      <p id="rules-empty-msg" class="empty-msg hidden">指摘がまだ登録されていません。</p>
    </section>

    <section class="panel manual-panel">
      <div class="panel-header">
        <h2>手引ビューア</h2>
      </div>
      <div id="manual-placeholder" class="manual-placeholder">
        左の指摘の「根拠」をクリックするか、上の検索結果からページを選択すると、該当する手引の本文がここに表示されます。
      </div>
      <div id="manual-detail" class="manual-detail hidden">
        <div class="manual-detail-meta">
          <span id="manual-page-badge" class="badge"></span>
          <span id="manual-chapter-section" class="manual-chapter-section"></span>
        </div>
        <h3 id="manual-heading"></h3>
        <p id="manual-text"></p>
      </div>
    </section>
  </main>
</div>

<!--
  前工程（手引きOCR/構造化パイプライン）が生成した rules.json と tebiki_text.json を
  そのままこの中に埋め込んでいます。外部ファイルの fetch は行いません。
  同内容のソースファイルを rules.json / tebiki_text.json としてこのフォルダに置いてあるので、
  前工程を再実行した場合はここも同じ内容に差し替えてください。
-->
<script type="application/json" id="rules-data">
[
  {
    "id": "R-001",
    "category": "安全",
    "title": "保護メガネの未着用",

</script>
<script type="application/json" id="tebiki-text-data">

<script src="app.js"></script>
</body>
</html>
