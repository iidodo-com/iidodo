const DEFAULT_MODEL = "claude-sonnet-4-6";

/* =========================================================
   2. localStorage ヘルパー
   ========================================================= */

const LS_KEYS = {
  apiKey: "wnk.apiKey",
  model: "wnk.model",
  persona: "wnk.context.persona",
  style: "wnk.context.style",
  projects: "wnk.context.projects",
  precedents: "wnk.context.precedents",
  learned: "wnk.context.learned",
  history: "wnk.history",
};

function lsGet(key, fallback) {
  const v = localStorage.getItem(key);
  return v === null ? fallback : v;
}
function lsSet(key, value) { localStorage.setItem(key, value); }

function initDefaults() {
  if (localStorage.getItem(LS_KEYS.persona) === null) lsSet(LS_KEYS.persona, DEFAULT_PERSONA);
  if (localStorage.getItem(LS_KEYS.style) === null) lsSet(LS_KEYS.style, DEFAULT_STYLE);
  if (localStorage.getItem(LS_KEYS.projects) === null) lsSet(LS_KEYS.projects, DEFAULT_PROJECTS);
  if (localStorage.getItem(LS_KEYS.precedents) === null) lsSet(LS_KEYS.precedents, DEFAULT_PRECEDENTS);
  if (localStorage.getItem(LS_KEYS.learned) === null) lsSet(LS_KEYS.learned, "");
  if (localStorage.getItem(LS_KEYS.model) === null) lsSet(LS_KEYS.model, DEFAULT_MODEL);
}

function getContext() {
  return {
    persona: lsGet(LS_KEYS.persona, DEFAULT_PERSONA),
    style: lsGet(LS_KEYS.style, DEFAULT_STYLE),
    projects: lsGet(LS_KEYS.projects, DEFAULT_PROJECTS),
    precedents: lsGet(LS_KEYS.precedents, DEFAULT_PRECEDENTS),
    learned: lsGet(LS_KEYS.learned, ""),
  };
}

function getHistory() {
  try {
    return JSON.parse(lsGet(LS_KEYS.history, "[]"));
  } catch (e) {
    return [];
  }
}
function saveHistory(entries) { lsSet(LS_KEYS.history, JSON.stringify(entries)); }
function appendHistory(entry) {
  const h = getHistory();
  h.push(entry);
  saveHistory(h);
}

const ROLE_DEFINITION = `あなたは「本人」ではない。本人の判断基準と文体を再現して下書きを作る役である。
本人になりきって一人称で断定するのではなく、本人が実際に書きそうな文章そのものを生成することが仕事である。
以下に本人のプロファイル・文体ルール・進行案件・過去事例・学習済みルールを与える。これらに書かれていない事実は
本人の判断根拠として使ってはならない。`;

function buildContextSection(ctx) {
  const parts = [
    ["## 本人プロファイル", ctx.persona],
    ["## 文体・回答作法のルール", ctx.style],
    ["## 進行中の案件と論点", ctx.projects],
    ["## 過去の判断事例", ctx.precedents],
    ["## 学習済みルール（フィードバックから蓄積）", ctx.learned.trim() || "（まだ蓄積なし）"],
  ];
  return parts.map(([title, body]) => title + "\n" + body).join("\n\n---\n\n");
}

- 一般論の羅列で終わらせない。意見を求められたら結論を先に書く。
- 出力は指定されたJSON形式のみ。コードフェンスや説明文、JSON以外の文字を一切含めない。`;

const DRAFT_FORMAT = `## 出力形式（回答生成モード）
次のTypeScript型に一致するJSONを1つだけ出力する。

type DraftOutput = {
  estimated_recipient: string | null;
  estimated_scene: string | null;
  estimated_length: string | null;
  answer: string;
  reasons: string[];
  risks: string;
  alternative: string;
};

- estimated_* は、その項目が未選択のときだけ本文から推定した値を入れる。選択済みならnull。
- reasons は3点以内。抽象的な理由ではなく、参照したcontextの項目名・案件名を挙げること。
- alternative は語尾やトーン違いの水増しを禁止する。方針そのものが違う代替案が無ければ"別案なし"。`;

const WALLBOUNCE_CRITIQUE_FORMAT = `## 出力形式（壁打ちモード・講評）
本人が書いた答えを講評する。代筆はしない。次のTypeScript型に一致するJSONを1つだけ出力する。

type WallbounceCritique = {

  verdict_reason: string;

const WALLBOUNCE_EDIT_FORMAT = `## 出力形式（壁打ちモード・添削）
本人が「直して」と明示的に要求した場合のみ、この形式で添削する。
本人の文体・語順を極力保持し、全面書き換えはしない。次のTypeScript型に一致するJSONを1つだけ出力する。

type WallbounceEdit = {
  changes: { location: string; before: string; after: string; reason: string }[];
  revised_text: string;
};`;

function buildSystemPrompt(ctx, mode) {
  const sections = [ROLE_DEFINITION, buildContextSection(ctx)];
  if (mode === "draft") sections.push(DRAFT_FORMAT);
  else if (mode === "wallbounce_critique") sections.push(WALLBOUNCE_CRITIQUE_FORMAT);
  else if (mode === "wallbounce_edit") sections.push(WALLBOUNCE_EDIT_FORMAT);
  sections.push(PROHIBITIONS);
  return sections.join("\n\n");
}

/* =========================================================
   4. Anthropic API 呼び出し（ブラウザから直接）
   ========================================================= */

function stripCodeFence(text) {
  const trimmed = text.trim();
  const m = trimmed.match(/^```(?:json)?\s*([\s\S]*?)\s*```$/);
  return m ? m[1] : trimmed;
}

async function callClaude(system, userMessage) {
  const apiKey = lsGet(LS_KEYS.apiKey, "");
  const model = lsGet(LS_KEYS.model, DEFAULT_MODEL);
  if (!apiKey) {
    throw new Error("APIキーが設定されていません。「設定・context編集」タブでAPIキーを入力してください。");
  }

  let res;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "content-type": "application/json",
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 4096,
        system: system,
        messages: [{ role: "user", content: userMessage }],
      }),
    });
  } catch (networkErr) {
    throw new Error(
      "通信に失敗しました。ネットワーク制限やプロキシ設定が原因の可能性があります。（詳細: " + networkErr.message + "）"
    );
  }

  if (!res.ok) {
    let detail = "";
    try {
      const errBody = await res.json();
      detail = errBody?.error?.message || JSON.stringify(errBody);
    } catch (e) {
      detail = res.statusText;
    }
    if (res.status === 401) {
      throw new Error("APIキーが正しくないか、無効です。設定タブでキーを確認してください。");
    }
    throw new Error("APIエラー（" + res.status + "）: " + detail);
  }

  const data = await res.json();
  const block = (data.content || []).find((b) => b.type === "text");
  if (!block) throw new Error("Claudeからテキスト応答が得られませんでした。");
  return block.text;
}

function parseJsonResponse(text) {
  return JSON.parse(stripCodeFence(text));
}

function getLearnedLines(learnedText) {
  return learnedText.split("\n").map((l) => l.trim()).filter((l) => l.length > 0);
}

async function applyLearnedRuleUpdate(action, targetIndex, rule) {
  if (action === "skip" || !rule) return;
  const learned = lsGet(LS_KEYS.learned, "");
  const lines = getLearnedLines(learned);
  const formatted = rule.startsWith("- ") ? rule : "- " + rule;
  if (action === "update" && targetIndex !== null && targetIndex >= 0 && targetIndex < lines.length) {
    lines[targetIndex] = formatted;
  } else {
    lines.push(formatted);
  }
  lsSet(LS_KEYS.learned, lines.join("\n") + "\n");
}

  wallbounce: { recipient: null, scene: null, critique: null, edit: null, loading: false, editLoading: false, error: null },
  historySelected: null,
};

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") e.className = attrs[k];
      else if (k === "html") e.innerHTML = attrs[k];
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach((c) => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return e;
}

function copyButton(getText) {
  const btn = el("button", { class: "btn secondary small" }, ["コピー"]);
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(getText());
      btn.textContent = "コピーしました";
      setTimeout(() => (btn.textContent = "コピー"), 1500);
    } catch (e) {
      /* clipboard未対応環境では何もしない */
    }
  });
  return btn;
}

function chipGroup(options, selected, onSelect) {
  const wrap = el("div", { class: "chips" });
  options.forEach((opt) => {
    const chip = el("button", {
      class: "chip" + (selected === opt ? " selected" : ""),
      type: "button",
      onclick: () => onSelect(selected === opt ? null : opt),
    }, [opt]);
    wrap.appendChild(chip);
  });
  return wrap;
}

function renderDraftTab(root) {
  const s = state.draft;
  const grid = el("div", { class: "grid2" });

  // 左：入力

  genBtn.disabled = s.loading || !textarea.value.trim();
  genBtn.addEventListener("click", () => generateDraft(textarea.value));
  textarea.addEventListener("input", () => {
    s.prefillText = textarea.value;
    genBtn.disabled = s.loading || !textarea.value.trim();
  });
  left.appendChild(textarea);

  const chipsWrap = el("div", { class: "grid2", style: "margin-top:12px;" });

  chipRow.appendChild(mkChipBlock("場面", SCENES, "scene"));
  chipRow.appendChild(mkChipBlock("長さ", LENGTHS, "length"));

  left.appendChild(el("div", { style: "margin-top:14px;" }, [genBtn]));

  if (s.error) left.appendChild(el("div", { class: "error-box", style: "margin-top:10px;" }, [s.error]));

  // 右：出力

  } else if (s.loading) {

function renderDraftResult(result) {
  const out = result.output;
  const wrap = el("div");

  const estimations = [];
  if (out.estimated_recipient) estimations.push("相手：" + out.estimated_recipient);
  if (out.estimated_scene) estimations.push("場面：" + out.estimated_scene);
  if (out.estimated_length) estimations.push("長さ：" + out.estimated_length);
  if (estimations.length > 0) {
    wrap.appendChild(el("div", { class: "warn-box" }, ["未選択の項目を本文から推定しました：" + estimations.join(" / ")]));
  }

  function block(title, text) {
    const card = el("div", { class: "card" });
    const head = el("div", { class: "card-head" }, [el("span", null, [title]), copyButton(() => text)]);
    const body = el("div", { class: "card-body" }, [text]);
    card.appendChild(head);
    card.appendChild(body);
    return card;
  }

  wrap.appendChild(block("① 私ならこう答える", out.answer));
  wrap.appendChild(block("② 判断の根拠", (out.reasons || []).map((r) => "・" + r).join("\n")));
  wrap.appendChild(block("③ 触れなかった論点・リスク", out.risks));
  wrap.appendChild(block("④ 別案", out.alternative));

  wrap.appendChild(renderFeedbackControls(result.historyId));

  return wrap;
}

async function generateDraft(text) {
  const s = state.draft;
  s.loading = true;
  s.error = null;
  s.result = null;
  render();
  try {
    const ctx = getContext();
    const system = buildSystemPrompt(ctx, "draft");
    const userMessage = buildDraftUserMessage({ text, recipient: s.recipient, scene: s.scene, length: s.length });
    const raw = await callClaude(system, userMessage);
    const output = parseJsonResponse(raw);
    const entry = {
      id: crypto.randomUUID(),
      timestamp: new Date().toISOString(),
      mode: "draft",
      input: { text, recipient: s.recipient, scene: s.scene, length: s.length },
      output,
    };
    appendHistory(entry);
    s.result = { historyId: entry.id, output };
  } catch (e) {
    s.error = e.message || String(e);
  } finally {
    s.loading = false;
    render();
  }
}

function renderFeedbackControls(historyId) {
  const wrap = el("div", { style: "border-top:1px solid #eee; padding-top:12px; margin-top:4px;" });
  const history = getHistory();
  const entry = history.find((h) => h.id === historyId);

  if (entry && entry.feedback) {
    const labelMap = { adopt: "採用", adopt_edited: "修正して採用", reject: "不採用" };
    const box = el("div", { class: "muted" }, ["評価を記録しました（" + labelMap[entry.feedback.verdict] + "）"]);
    if (entry.feedback.rule) {
      box.appendChild(el("div", { class: "muted", style: "margin-top:4px;" }, [
        "学習メモに反映：「" + entry.feedback.rule + "」",
      ]));
    }
    wrap.appendChild(box);
    return wrap;
  }

  wrap.appendChild(el("div", { class: "muted", style: "margin-bottom:8px;" }, ["この回答案を評価してください"]));
  const row = el("div", { class: "row" });

  const adoptBtn = el("button", { class: "btn secondary small" }, ["採用"]);
  adoptBtn.addEventListener("click", () => submitFeedback(historyId, "adopt"));

  const editBtn = el("button", { class: "btn secondary small" }, ["修正して採用"]);
  const rejectBtn = el("button", { class: "btn secondary small" }, ["不採用"]);
  rejectBtn.addEventListener("click", () => submitFeedback(historyId, "reject"));

  row.appendChild(adoptBtn);
  row.appendChild(editBtn);
  row.appendChild(rejectBtn);
  wrap.appendChild(row);

  const editArea = el("div", { style: "display:none; margin-top:10px;" });
  const editTextarea = el("textarea", { rows: "6", placeholder: "実際に使った（修正後の）本文を貼り付けてください" });
  const submitEditBtn = el("button", { class: "btn small", style: "margin-top:8px;" }, ["この内容で記録する"]);
  submitEditBtn.addEventListener("click", () => {
    if (!editTextarea.value.trim()) return;
    submitFeedback(historyId, "adopt_edited", editTextarea.value);
  });
  editArea.appendChild(editTextarea);
  editArea.appendChild(el("div", null, [submitEditBtn]));
  editBtn.addEventListener("click", () => { editArea.style.display = editArea.style.display === "none" ? "block" : "none"; });
  wrap.appendChild(editArea);

  return wrap;
}

async function submitFeedback(historyId, verdict, editedText) {
  const history = getHistory();
  const idx = history.findIndex((h) => h.id === historyId);
  if (idx === -1) return;
  const entry = history[idx];

  let ruleUpdate = { action: "skip", rule: null };

  if (verdict === "adopt_edited" && editedText && entry.mode === "draft") {
    try {
      const ctx = getContext();
      const existingLines = getLearnedLines(ctx.learned);
      const system = buildLearnSystemPrompt(existingLines);
      const userMessage = buildLearnUserMessage({
        originalAnswer: entry.output.answer,
        editedAnswer: editedText,
        recipient: entry.input.recipient,
        scene: entry.input.scene,
      });
      const raw = await callClaude(system, userMessage);
      const extraction = parseJsonResponse(raw);
      await applyLearnedRuleUpdate(extraction.action, extraction.target_index, extraction.rule);
      ruleUpdate = { action: extraction.action, rule: extraction.rule };
    } catch (e) {
      // 学習抽出に失敗しても、フィードバック自体の記録は続行する
      ruleUpdate = { action: "skip", rule: null };
    }
  }

  entry.feedback = { verdict, editedText, ruleAction: ruleUpdate.action, rule: ruleUpdate.rule };
  history[idx] = entry;
  saveHistory(history);
  render();
}

  if (s.edit) {
    const changesCard = el("div", { class: "card" });
    changesCard.appendChild(el("div", { class: "card-head" }, ["変更箇所と理由"]));
    const changesBody = el("div", { class: "card-body" });
    (s.edit.changes || []).forEach((c) => {
      changesBody.appendChild(el("div", { class: "diff-item" }, [
        el("div", { class: "muted" }, [c.location]),
        el("div", { class: "diff-before" }, [c.before]),
        el("div", null, [c.after]),
        el("div", { class: "diff-reason" }, ["理由：" + c.reason]),
      ]));
    });
    if (!(s.edit.changes || []).length) changesBody.appendChild(el("div", { class: "muted" }, ["変更なし"]));
    changesCard.appendChild(changesBody);
    right.appendChild(changesCard);

    const revisedCard = el("div", { class: "card" });
    revisedCard.appendChild(el("div", { class: "card-head" }, [el("span", null, ["添削後の全文"]), copyButton(() => s.edit.revised_text)]));
    revisedCard.appendChild(el("div", { class: "card-body" }, [s.edit.revised_text]));
    right.appendChild(revisedCard);
  }

  grid.appendChild(right);
  root.appendChild(grid);
}

async function generateCritique(text, myAnswer) {
  const s = state.wallbounce;
  s.loading = true;
  s.error = null;
  s.critique = null;
  s.edit = null;
  render();
  try {
    const ctx = getContext();
    const system = buildSystemPrompt(ctx, "wallbounce_critique");
    const userMessage = buildWallbounceUserMessage({ text, myAnswer, recipient: s.recipient, scene: s.scene });
    const raw = await callClaude(system, userMessage);
    const output = parseJsonResponse(raw);
    appendHistory({
      id: crypto.randomUUID(),
      timestamp: new Date().toISOString(),
      mode: "wallbounce_critique",
      input: { text, myAnswer, recipient: s.recipient, scene: s.scene },
      output,
    });
    s.critique = output;
  } catch (e) {
    s.error = e.message || String(e);
  } finally {
    s.loading = false;
    render();
  }
}

async function generateEdit(text, myAnswer) {
  const s = state.wallbounce;
  s.editLoading = true;
  s.error = null;
  render();
  try {
    const ctx = getContext();
    const system = buildSystemPrompt(ctx, "wallbounce_edit");
    const userMessage = buildWallbounceEditUserMessage({ text, myAnswer });
    const raw = await callClaude(system, userMessage);
    const output = parseJsonResponse(raw);
    appendHistory({
      id: crypto.randomUUID(),
      timestamp: new Date().toISOString(),
      mode: "wallbounce_edit",
      input: { text, myAnswer, recipient: null, scene: null },
      output,
    });
    s.edit = output;
  } catch (e) {
    s.error = e.message || String(e);
  } finally {
    s.editLoading = false;
    render();
  }
}

/* =========================================================
   8. 履歴
   ========================================================= */

function modeLabel(mode) {
  if (mode === "draft") return "回答生成";
  if (mode === "wallbounce_critique") return "壁打ち・講評";
  return "壁打ち・添削";
}
function feedbackLabel(v) {
  if (v === "adopt") return "採用";
  if (v === "adopt_edited") return "修正して採用";
  return "不採用";
}

function renderHistoryTab(root) {
  const grid = el("div", { class: "grid2" });
  const left = el("div");
  const searchInput = el("input", { type: "text", placeholder: "履歴を検索" });
  left.appendChild(searchInput);

  const list = el("div", { style: "margin-top:10px;" });
  left.appendChild(list);

  function renderList() {
    list.innerHTML = "";
    const query = searchInput.value.trim().toLowerCase();
    const history = getHistory().slice().reverse();
    const filtered = history.filter((h) => {
      if (!query) return true;
      const hay = [h.input.text, h.input.myAnswer, JSON.stringify(h.output)].join(" ").toLowerCase();
      return hay.includes(query);
    });
    if (filtered.length === 0) {
      list.appendChild(el("div", { class: "muted" }, ["履歴がありません"]));
      return;
    }
    filtered.forEach((h) => {
      const item = el("div", {
        class: "history-item" + (state.historySelected && state.historySelected.id === h.id ? " selected" : ""),
        onclick: () => { state.historySelected = h; render(); },
      });
      item.appendChild(el("div", { class: "history-meta" }, [modeLabel(h.mode), new Date(h.timestamp).toLocaleString("ja-JP")]));
      const preview = el("div", null, [(h.input.text || "").slice(0, 80)]);
      item.appendChild(preview);
      if (h.feedback) {
        item.appendChild(el("div", { class: "muted", style: "margin-top:4px;" }, ["評価：" + feedbackLabel(h.feedback.verdict)]));
      }
      list.appendChild(item);
    });
  }
  searchInput.addEventListener("input", renderList);
  renderList();

  const right = el("div");
  const sel = state.historySelected;
  if (!sel) {
    right.appendChild(el("div", { class: "muted" }, ["履歴を選択すると詳細が表示されます"]));
  } else {
    const inputCard = el("div", { class: "card" });
    const inputBody = el("div", { class: "card-body" });
    inputBody.appendChild(el("div", { class: "muted" }, ["入力"]));
    inputBody.appendChild(el("div", null, [sel.input.text]));
    if (sel.input.myAnswer) {
      inputBody.appendChild(el("div", { class: "muted", style: "margin-top:8px;" }, ["本人の答え"]));
      inputBody.appendChild(el("div", null, [sel.input.myAnswer]));
    }
    inputCard.appendChild(inputBody);
    right.appendChild(inputCard);

    const outCard = el("div", { class: "card" });
    outCard.appendChild(el("div", { class: "card-body" }, [
      el("div", { class: "muted" }, ["出力"]),
      el("pre", { style: "white-space:pre-wrap; font-size:12px; color:#555;" }, [JSON.stringify(sel.output, null, 2)]),
    ]));
    right.appendChild(outCard);

    if (sel.mode === "draft") {
      const reuseBtn = el("button", { class: "btn secondary" }, ["この入力を回答生成モードに呼び戻す"]);
      reuseBtn.addEventListener("click", () => {
        state.draft.prefillText = sel.input.text;
        state.draft.recipient = sel.input.recipient;
        state.draft.scene = sel.input.scene;
        state.draft.length = sel.input.length;
        state.tab = "draft";
        render();
      });
      right.appendChild(reuseBtn);
    }
  }

  grid.appendChild(left);
  grid.appendChild(right);
  root.appendChild(grid);
}

/* =========================================================
   9. 設定・context編集
   ========================================================= */

function renderSettingsTab(root) {
  const wrap = el("div");

  // APIキー
  const apiSection = el("div", { class: "settings-section" });
  apiSection.appendChild(el("h3", null, ["Anthropic APIキー"]));
  apiSection.appendChild(el("div", { class: "warn-box" }, [
    "このキーはブラウザのlocalStorageに平文で保存されます。共有PCでは使用後に「キーを削除」してください。" +
    "自分専用のPCであれば、通常は保存したままで問題ありません。",
  ]));
  const apiRow = el("div", { class: "row" });
  const apiInput = el("input", { type: "password", placeholder: "sk-ant-..." });
  apiInput.value = lsGet(LS_KEYS.apiKey, "");
  const apiSaveBtn = el("button", { class: "btn small" }, ["保存"]);
  const apiDeleteBtn = el("button", { class: "btn secondary small" }, ["キーを削除"]);
  const apiMsg = el("span", { class: "muted" }, [""]);
  apiSaveBtn.addEventListener("click", () => {
    lsSet(LS_KEYS.apiKey, apiInput.value.trim());
    apiMsg.textContent = "保存しました";
    updateStatusLine();
    setTimeout(() => (apiMsg.textContent = ""), 1500);
  });
  apiDeleteBtn.addEventListener("click", () => {
    localStorage.removeItem(LS_KEYS.apiKey);
    apiInput.value = "";
    apiMsg.textContent = "削除しました";
    updateStatusLine();
    setTimeout(() => (apiMsg.textContent = ""), 1500);
  });
  apiRow.appendChild(apiInput);
  apiRow.appendChild(apiSaveBtn);
  apiRow.appendChild(apiDeleteBtn);
  apiRow.appendChild(apiMsg);
  apiSection.appendChild(apiRow);
  wrap.appendChild(apiSection);

  // モデル
  const modelSection = el("div", { class: "settings-section" });
  modelSection.appendChild(el("h3", null, ["モデルID"]));
  const modelRow = el("div", { class: "row" });
  const modelInput = el("input", { type: "text" });
  modelInput.value = lsGet(LS_KEYS.model, DEFAULT_MODEL);
  const modelSaveBtn = el("button", { class: "btn small" }, ["保存"]);
  const modelMsg = el("span", { class: "muted" }, [""]);
  modelSaveBtn.addEventListener("click", () => {
    lsSet(LS_KEYS.model, modelInput.value.trim() || DEFAULT_MODEL);
    modelMsg.textContent = "保存しました";
    setTimeout(() => (modelMsg.textContent = ""), 1500);
  });
  modelRow.appendChild(modelInput);
  modelRow.appendChild(modelSaveBtn);
  modelRow.appendChild(modelMsg);
  modelSection.appendChild(modelRow);
  wrap.appendChild(modelSection);

  // context編集
  function contextField(label, key, rows, note) {
    const section = el("div", { class: "settings-section" });
    section.appendChild(el("h3", null, [label]));
    if (note) section.appendChild(el("div", { class: "muted", style: "margin-bottom:6px;" }, [note]));
    const ta = el("textarea", { rows: String(rows) });
    ta.value = lsGet(key, "");
    const saveBtn = el("button", { class: "btn small", style: "margin-top:6px;" }, ["保存"]);
    const msg = el("span", { class: "muted", style: "margin-left:8px;" }, [""]);
    saveBtn.addEventListener("click", () => {
      lsSet(key, ta.value);
      msg.textContent = "保存しました（次回の生成から反映されます）";
      setTimeout(() => (msg.textContent = ""), 2000);
    });
    section.appendChild(ta);
    section.appendChild(el("div", null, [saveBtn, msg]));
    return section;
  }

  wrap.appendChild(contextField("本人プロファイル", LS_KEYS.persona, 10));
  wrap.appendChild(contextField("文体・回答作法のルール", LS_KEYS.style, 10));
  wrap.appendChild(contextField("進行中の案件と論点", LS_KEYS.projects, 10, "変わりやすい情報なので、定期的にここを更新してください。"));
  wrap.appendChild(contextField("過去の判断事例", LS_KEYS.precedents, 8));
  wrap.appendChild(contextField("学習済みルール", LS_KEYS.learned, 8, "「修正して採用」を選ぶたびに自動で追記されます。直接編集も可能です。"));

  const resetSection = el("div", { class: "settings-section" });
  const resetBtn = el("button", { class: "btn secondary small" }, ["本人プロファイル/文体/案件/過去事例を初期状態に戻す"]);
  resetBtn.addEventListener("click", () => {
    if (!confirm("編集内容を破棄して初期状態に戻します。よろしいですか？（学習済みルールは変更されません）")) return;
    lsSet(LS_KEYS.persona, DEFAULT_PERSONA);
    lsSet(LS_KEYS.style, DEFAULT_STYLE);
    lsSet(LS_KEYS.projects, DEFAULT_PROJECTS);
    lsSet(LS_KEYS.precedents, DEFAULT_PRECEDENTS);
    render();
  });
  resetSection.appendChild(resetBtn);
  wrap.appendChild(resetSection);

  root.appendChild(wrap);
}

/* =========================================================
   10. レンダリングルート
   ========================================================= */

function updateStatusLine() {
  const statusLine = document.getElementById("statusLine");
  const hasKey = !!lsGet(LS_KEYS.apiKey, "");
  statusLine.textContent = hasKey ? "APIキー設定済み" : "APIキー未設定（設定タブで入力してください）";
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = "";
  if (state.tab === "draft") renderDraftTab(app);
  else if (state.tab === "wallbounce") renderWallbounceTab(app);
  else if (state.tab === "history") renderHistoryTab(app);
  else if (state.tab === "settings") renderSettingsTab(app);

  document.querySelectorAll("#tabNav button").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.tab === state.tab);
  });

  updateStatusLine();
}

document.getElementById("tabNav").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if (!btn) return;
  state.tab = btn.dataset.tab;
  render();
});

initDefaults();
render();
</script>
